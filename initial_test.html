self._d[:], self.dtype)\n    def sort(self):\n        self._d.sort()\n    def sum(self):\n        t = 0\n        for x in self._d:\n            t = t + x\n        return t\n    def max(self):\n        return max(self._d)\n    def min(self):\n        return min(self._d)\n\ndef _dt(dtype):\n    if dtype is None:\n        return None\n    if dtype is int or dtype == 'int' or dtype == 'int32' or dtype == 'int64':\n        return 'int'\n    if dtype is float or dtype == 'float' or dtype == 'float64':\n        return 'float'\n    if dtype is str or dtype == 'str':\n        return 'str'\n    if dtype is bool or dtype == 'bool':\n        return 'bool'\n    return None\n\ndef array(data, dtype=None):\n    d = [x for x in data]\n    for x in d:\n        if isinstance(x, (list, tuple)):\n            raise TypeError('seuls les tableaux a une dimension sont disponibles ici')\n    dt = _dt(dtype)\n    if dt is None:\n        if len(d) == 0:\n            dt = 'float'\n        elif [x for x in d if isinstance(x, str)]:\n            dt = 'str'\n        elif [x for x in d if isinstance(x, float)]:\n            dt = 'float'\n        elif len([x for x in d if isinstance(x, bool)]) == len(d):\n            dt = 'bool'\n        else:\n            dt = 'int'\n    a = ndarray(d, dt)\n    for k in range(len(d)):\n        d[k] = a._c(d[k])\n    return a\n\ndef zeros(n, dtype=float):\n    dt = _dt(dtype)\n    if dt is None:\n        dt = 'float'\n    v = 0\n    if dt == 'float':\n        v = 0.0\n    if dt == 'str':\n        v = ''\n    if dt == 'bool':\n        v = False\n    return ndarray([v for k in range(n)], dt)\n\ndef empty(n, dtype=float):\n    return zeros(n, dtype)\n\ndef ones(n, dtype=float):\n    a = zeros(n, dtype)\n    for k in range(n):\n        a[k] = 1\n    return a\n\ndef arange(a, b=None, step=1):\n    if b is None:\n        b = a\n        a = 0\n    return ndarray([x for x in range(a, b, step)], 'int')\nimport math\n\ndef sqrt(x):\n    return math.sqrt(x)\n";
